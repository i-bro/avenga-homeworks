<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="main-div">
        <div class="first-left">

            <div class="first-left-top">
                <div class="top-inner-one">
                    <div class="top-inner-one-child-1"></div>
                    <div class="top-inner-one-child-2"></div>
                </div>
                <div class="top-inner-two"></div>
            </div>

            <div class="first-left-bottom">
                <div class="left-side-small">
                    <div class="left-side-small-top"></div>
                    <div class="left-side-small-middle"></div>
                    <div class="left-side-small-bottom"></div>
                </div>
                <div class="rigth-side-big">
                    <div class="rigth-side-big-top">
                        <div class="red-box"></div>
                        <div class="right-to-red-box">
                            <div class="yellow-to-red-top"></div>
                            <div class="two-bedge-bottom">
                                <div class="bedge-bottom-left"></div>
                                <div class="bedge-bottom-right"></div>
                            </div>
                        </div>
                    </div>
                    <div class="rigth-side-big-bottom">
                        <div class="left-side">
                            <div class="left-side-top"></div>
                            <div class="left-side-bottom"></div>
                        </div>
                        <div class="right-side">
                            <div class="right-side-last-top">
                                <div class="right-side-last-top-left">
                                    <div class="white-top"></div>
                                    <div class="white-middle"></div>
                                    <div class="black-bottom"></div>
                                </div>
                                <div class="right-side-last-top-rigth">
                                    <div class="top-white-l"></div>
                                    <div class="bottom-purple"></div>
                                </div>
                            </div>
                            <div class="right-side-last-bottom"></div>
                        </div>
                    </div>
                </div>
            </div>

        </div>

        <div class="first-right">
            <div class="first-right-top"></div>
            <div class="first-right-bottom"></div>
        </div>
    </div>
</body>
</html>
