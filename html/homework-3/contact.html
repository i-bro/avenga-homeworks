<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
<header>
    <h1>Contact Us</h1>
    <nav>
        <a href="index.html">Home</a>
        <a href="news.html">Latest News</a>
        <a href="login.html">Login</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
        <a href="videos.html">Videos</a>
    </nav>
</header>

<main class="contact-container">

    <section>
        <form class="contact-box" id="contactForm">
        <h2>Send us a message</h2>

        <label for="name">Full Name</label>
        <input type="text" id="name" placeholder="Enter your name" required>

        <label for="email">Email</label>
        <input type="email" id="email" placeholder="Enter your email" required>

        <label for="message">Message</label>
        <textarea id="message" rows="5" placeholder="Write your message here..." required></textarea>

        <button type="submit">Send Message</button>
    </form>
    </section>
    <section>
        <p>Have questions, feedback, or suggestions?
        Our team reads every message and usually responds within 24 hours.
        Feel free to reach out!</p>
    </section>

</main>

<footer>
    <p>© 2025 Mini News Website</p>
</footer>

<script>
    document.getElementById("contactForm").addEventListener("submit", function(event) {
        event.preventDefault();
        let name = document.getElementById("name").value;
        alert("Thank you for reaching out, " + name + "! We will get back to you soon.");
    });
</script>
</body>
</html>
