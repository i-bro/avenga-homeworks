<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="./style.css" />
    <link rel="stylesheet" href="./profile.css" />
  </head>
  <body>
    <nav class="navbar">
      <a href="./index.html" class="logo">NexaNext</a>
      <div class="nav-links" id="navLinks">
        <a href="./login.html" id="logIn" class="loginBtn">log in</a>
        <a href="./register.html" id="register" class="registerBtn">register</a>
        <button id="logOut" class="logOutBtn">log out</button>
      </div>
      <button class="hamburger" id="hamburger">☰</button>
      <button id="themeToggle" class="theme-btn">🌙</button>
    </nav>
    <div id="loader" class="loader hidden">
      <div class="spinner"></div>
      <p>Loading...</p>
    </div>
    <div class="profile">
      <img id="avatar" />
      <h1 id="name"></h1>
      <p id="email"></p>
      <p id="job"></p>
      <p id="birthday"></p>
      <p id="location"></p>

      <h3 class="title-friends">Friends</h3>
      <ul id="friends" class="friends"></ul>

      <h3>Posts</h3>
      <div id="posts"></div>

      <button id="photosBtn">View Photos</button>
    </div>

    <script src="./jscode/profilePage.js" type="module"></script>
    <script src="./jscode/navbar.js" type="module"></script>
  </body>
</html>
