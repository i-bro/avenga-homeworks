<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>

    <style>
    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 10px;
      padding: 20px;
    }

    .gallery img {
      width: 100%;
      height: 180px;
      object-fit: cover;
      cursor: pointer;
      border-radius: 8px;
    }

    /* Modal */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.8);
      align-items: center;
      justify-content: center;
    }

    .modal img {
      max-width: 90%;
      max-height: 90%;
      border-radius: 10px;
    }
  </style>

  </head>
  <body>
    <h1 id="galleryTitle"></h1>

    <div class="gallery" id="gallery"></div>

    <div class="modal" id="modal">
      <img id="modalImg" />
    </div>

    
    <script src="./jscode/galleryPage.js" type="module"></script>
    <script src="./jscode/navbar.js" type="module"></script>
  </body>
</html>
